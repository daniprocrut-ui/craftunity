<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171B">
<title>Craftunity Чат</title>
<link rel="manifest" href="chat.webmanifest">
<style>
  :root{
    --bg:#14171B; --panel:#1D2126; --card:#262B32; --line:#323A44;
    --text:#EEF1F5; --muted:#8B95A1; --accent:#7DD3FC; --danger:#F87171;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    display:flex;align-items:center;gap:10px;padding:12px 14px;
    background:var(--panel);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:5;
  }
  header h1{font-size:16px;margin:0;flex:1;font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--danger)}
  .dot.on{background:#4ADE80}
  .tabs{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;background:var(--panel)}
  .tab{
    border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:6px 12px;border-radius:8px;font-size:13px;white-space:nowrap;cursor:pointer;
  }
  .tab.active{color:var(--text);border-color:var(--accent)}
  main{flex:1;overflow-y:auto;padding:12px 14px 8px;-webkit-overflow-scrolling:touch}
  .msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start}
  .msg img.av{width:32px;height:32px;border-radius:8px;object-fit:cover;background:var(--card);flex:none}
  .body{flex:1;min-width:0}
  .who{font-size:12px;color:var(--muted);margin-bottom:2px;display:flex;gap:6px;align-items:baseline}
  .who b{color:var(--text);font-weight:600;font-size:13px}
  .bubble{background:var(--card);border-radius:10px;padding:8px 10px;word-wrap:break-word;white-space:pre-wrap}
  .mine .bubble{background:#1E3A4B}
  .bubble a{color:var(--accent)}
  .bubble .pic{max-width:100%;border-radius:8px;margin-top:6px;display:block}
  .reply{border-left:2px solid var(--line);padding-left:8px;margin-bottom:6px;color:var(--muted);font-size:12px}
  .empty{color:var(--muted);text-align:center;margin-top:40px}
  footer{
    background:var(--panel);border-top:1px solid var(--line);padding:10px 12px;
    display:flex;flex-direction:column;gap:8px;
  }
  .row{display:flex;gap:8px;align-items:flex-end}
  textarea{
    flex:1;resize:none;max-height:120px;min-height:40px;padding:10px 12px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    color:var(--text);font:inherit;outline:none;
  }
  textarea:focus{border-color:var(--accent)}
  button.primary{
    background:var(--accent);color:#0B1014;border:0;border-radius:10px;
    padding:11px 14px;font-weight:600;font-size:14px;cursor:pointer;
  }
  button.primary:disabled{opacity:.45}
  .peerbar{display:flex;gap:8px;align-items:center}
  select{
    flex:1;background:var(--card);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:9px 10px;font:inherit;
  }
  .notice{font-size:12px;color:var(--muted)}
  .notice.err{color:var(--danger)}
  .queued{opacity:.6}
  .queued .bubble{border:1px dashed var(--line);background:transparent}
  #login{display:none;flex-direction:column;gap:10px;padding:18px 14px}
  #login.show{display:flex}
  #login input{
    width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font:inherit;
  }
  #login button{margin-top:4px}
  .hidden{display:none !important}
</style>
</head>
<body>
<header>
  <span class="dot" id="net"></span>
  <h1 id="title">Craftunity</h1>
  <button class="tab" id="logout" style="display:none">Выйти</button>
</header>

<div id="login">
  <p class="notice">Войдите, чтобы писать в чат. Ник должен совпадать с ником в лаунчере — так ваши сообщения попадут в общий чат.</p>
  <input id="nick" placeholder="Ваш ник" autocomplete="username" maxlength="32">
  <input id="code" placeholder="Код доступа (если есть)" autocomplete="off">
  <button class="primary" id="signin">Войти</button>
  <p class="notice" id="loginerr"></p>
</div>

<div class="tabs hidden" id="tabs">
  <button class="tab active" data-channel="general">Общий чат</button>
  <button class="tab" data-channel="news">Новости</button>
  <button class="tab" data-channel="dm">Личные</button>
</div>

<main id="feed" class="hidden">
  <div class="empty" id="emptyState">Сообщений пока нет</div>
</main>

<footer class="hidden" id="composer">
  <div class="peerbar hidden" id="peerRow">
    <select id="peer"></select>
  </div>
  <div class="row">
    <textarea id="input" rows="1" placeholder="Сообщение…" maxlength="500"></textarea>
    <button class="primary" id="send">Отпр.</button>
  </div>
  <div class="notice" id="status"></div>
</footer>

<script>
(() => {
  const API = "https://craftunity-heartbeat.daniprocrut-ui.workers.dev";
  const LS = {
    nick: "cu_chat_nick", code: "cu_chat_code", id: "cu_chat_inst",
    cache: "cu_chat_cache", queue: "cu_chat_queue", channel: "cu_chat_channel"
  };
  const $ = (id) => document.getElementById(id);
  const state = {
    nick: localStorage.getItem(LS.nick) || "",
    code: localStorage.getItem(LS.code) || "",
    instanceId: localStorage.getItem(LS.id) || "",
    channel: localStorage.getItem(LS.channel) || "general",
    peer: "",
    peers: [],
    messages: [],
    lastId: 0,
    online: navigator.onLine !== false,
    sending: false,
  };

  // ---------------------------------------------------------------- утилиты
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const linkify = (s) => esc(s).replace(/(https?:\/\/[^\s<]+)/g,
    (m) => `<a href="${m}" target="_blank" rel="noopener noreferrer">${m}</a>`);

  const timeLabel = (at) => {
    const d = new Date((Number(at) || 0) * 1000);
    if (Number.isNaN(d.getTime())) return "";
    const today = new Date();
    const sameDay = d.toDateString() === today.toDateString();
    return sameDay
      ? d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })
      : d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }) + " " +
        d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  };

  const setStatus = (text, isError = false) => {
    const el = $("status");
    el.textContent = text || "";
    el.className = "notice" + (isError ? " err" : "");
  };

  const roomUrl = (since = 0) => {
    const p = new URLSearchParams({ channel: state.channel, since: String(since) });
    if (state.channel === "dm") {
      p.set("self", state.instanceId);
      p.set("peer", state.peer || "");
    }
    return `${API}/messages?${p.toString()}`;
  };

  // --------------------------------------------------------- локальный кэш
  const readJson = (key, fallback) => {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
    catch { return fallback; }
  };
  const writeJson = (key, value) => {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* мало места */ }
  };

  const queue = () => readJson(LS.queue, []);

  const addToQueue = (message) => {
    const items = queue();
    items.push(message);
    writeJson(LS.queue, items.slice(-50));
  };

  const saveCache = () => {
    writeJson(LS.cache, {
      channel: state.channel,
      peer: state.peer,
      lastId: state.lastId,
      messages: state.messages.slice(-300),
    });
  };

  const loadCache = () => {
    const cached = readJson(LS.cache, null);
    if (!cached) return;
    state.messages = Array.isArray(cached.messages) ? cached.messages : [];
    state.lastId = Number(cached.lastId) || 0;
    // Канал запоминаем тот же, что был открыт: так история не путается.
    if (cached.channel) state.channel = cached.channel;
    if (cached.peer) state.peer = cached.peer;
  };

  // ------------------------------------------------------------- отрисовка
  function render() {
    const feed = $("feed");
    const mine = state.nick.toLowerCase();
    const visible = state.messages;
    feed.querySelectorAll(".msg").forEach((n) => n.remove());
    $("emptyState").classList.toggle("hidden", visible.length > 0);

    for (const msg of visible) {
      const row = document.createElement("div");
      row.className = "msg" + (String(msg.username || "").toLowerCase() === mine ? " mine" : "")
        + (msg.queued ? " queued" : "");
      const avatar = msg.icon && /^(https?:|data:)/.test(msg.icon)
        ? `<img class="av" src="${esc(msg.icon)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
        : `<img class="av" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">`;
      const reply = msg.reply_to && msg.reply_to.text
        ? `<div class="reply"><b>${esc(msg.reply_to.author || "")}</b>: ${esc(msg.reply_to.text)}</div>`
        : "";
      const picture = msg.image
        ? `<img class="pic" src="${esc(msg.image)}" alt="картинка" loading="lazy">`
        : "";
      row.innerHTML =
        avatar +
        `<div class="body"><div class="who"><b>${esc(msg.username || "Без имени")}</b>` +
        `<span>${esc(timeLabel(msg.at))}</span>${msg.queued ? "<span>· ждёт отправки</span>" : ""}</div>` +
        `<div class="bubble">${reply}${linkify(msg.text || "")}${picture}</div></div>`;
      feed.appendChild(row);
    }
    feed.scrollTop = feed.scrollHeight;
  }

  // ---------------------------------------------------------- фильтрация
  function merge(incoming) {
    const byId = new Map(state.messages.filter((m) => !m.queued).map((m) => [m.id, m]));
    for (const msg of incoming) {
      byId.set(msg.id, msg);
      state.lastId = Math.max(state.lastId, Number(msg.id) || 0);
    }
    const merged = [...byId.values()].sort((a, b) => (a.id || 0) - (b.id || 0));
    const pending = state.messages.filter((m) => m.queued);
    state.messages = merged.concat(pending);
  }

  // ----------------------------------------------------------------- сеть
  async function pull(full = false) {
    if (!state.instanceId) return;
    if (state.channel === "dm" && !state.peer) return;
    try {
      const response = await fetch(roomUrl(full ? 0 : state.lastId), { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      state.online = true;
      merge(Array.isArray(data.messages) ? data.messages : []);
      saveCache();
      render();
      setStatus("");
    } catch (err) {
      state.online = false;
      setStatus("Нет связи — показываю сохранённое", true);
    }
    updateNet();
  }

  async function flushQueue() {
    const items = queue();
    if (items.length === 0) return;
    const rest = [];
    for (const item of items) {
      const ok = await post(item, true);
      if (!ok) rest.push(item);
    }
    writeJson(LS.queue, rest);
  }

  async function post(message, silent = false) {
    const payload = {
      instance_id: state.instanceId,
      username: state.nick,
      text: message.text,
      channel: message.channel,
      peer: message.peer || "",
      reply_author: "",
      reply_text: "",
    };
    try {
      const response = await fetch(`${API}/message`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        if (!silent) setStatus(data.error === "too fast" ? "Слишком часто, подожди пару секунд" : "Не отправлено: " + (data.error || response.status), true);
        return response.status === 429 ? true : false;
      }
      return true;
    } catch {
      return false;
    }
  }

  async function send() {
    if (state.sending) return;
    const input = $("input");
    const text = input.value.trim();
    if (!text) return;
    if (!state.nick) { showLogin(); return; }
    state.sending = true;
    $("send").disabled = true;
    const payload = {
      text,
      channel: state.channel,
      peer: state.channel === "dm" ? state.peer : "",
    };
    try {
      const ok = await post(payload);
      if (ok) {
        input.value = "";
        input.style.height = "auto";
        await flushQueue();
        await pull(false);
        setStatus("");
      } else {
        // Нет сети — кладём в очередь и показываем сразу.
        const queued = { ...payload, id: "q" + Date.now(), queued: true, username: state.nick, at: Date.now() / 1000 };
        state.messages.push(queued);
        addToQueue(payload);
        saveCache();
        render();
        input.value = "";
        setStatus("Нет связи — сообщение отправится, когда появится сеть", true);
      }
    } finally {
      state.sending = false;
      $("send").disabled = false;
    }
  }

  // -------------------------------------------------------------- вход
  function showLogin() {
    $("login").classList.add("show");
    $("tabs").classList.add("hidden");
    $("feed").classList.add("hidden");
    $("composer").classList.add("hidden");
    $("logout").style.display = "none";
    $("title").textContent = "Craftunity";
    $("nick").value = state.nick;
    $("code").value = state.code;
  }

  function showChat() {
    $("login").classList.remove("show");
    $("tabs").classList.remove("hidden");
    $("feed").classList.remove("hidden");
    $("composer").classList.remove("hidden");
    $("logout").style.display = "";
    $("title").textContent = state.channel === "dm" ? "Личные сообщения" : "Craftunity";
  }

  function instanceFor(nick) {
    // Устойчивый идентификатор из ника: тот же вход на другом устройстве — та же история.
    let hash = 0;
    for (let i = 0; i < nick.length; i++) {
      hash = (hash * 31 + nick.charCodeAt(i)) >>> 0;
    }
    return "mobile-" + nick.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 12) + "-" + hash.toString(36);
  }

  async function signIn() {
    const nick = $("nick").value.trim();
    const code = $("code").value.trim();
    if (!/^[A-Za-z0-9_.\-]{2,32}$/.test(nick)) {
      $("loginerr").textContent = "Ник: 2–32 символа, латиница, цифры, _ . -";
      return;
    }
    state.nick = nick;
    state.code = code;
    state.instanceId = instanceFor(nick);
    localStorage.setItem(LS.nick, nick);
    localStorage.setItem(LS.code, code);
    localStorage.setItem(LS.id, state.instanceId);
    $("loginerr").textContent = "";
    showChat();
    await refreshPeers();
    await flushQueue();
    await pull(true);
  }

  function signOut() {
    localStorage.removeItem(LS.nick);
    localStorage.removeItem(LS.code);
    state.nick = "";
    state.code = "";
    state.messages = [];
    showLogin();
  }

  // ------------------------------------------------------------- собеседники
  async function refreshPeers() {
    try {
      const response = await fetch(`${API}/clients?content=0&light=1&token=fc0cd5aa8afe801c8a2bd3dbe9ee3796`, { cache: "no-store" });
      if (!response.ok) return;
      const data = await response.json();
      const list = (data.clients || [])
        .filter((c) => c.username && c.instance_id && c.instance_id !== state.instanceId)
        .map((c) => ({ id: c.instance_id, name: c.username }))
        .sort((a, b) => a.name.localeCompare(b.name, "ru"));
      state.peers = list;
      const select = $("peer");
      select.innerHTML = list.map((p) =>
        `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("") || `<option value="">Нет игроков</option>`;
      if (!state.peer && list.length) state.peer = list[0].id;
      if (state.peer) select.value = state.peer;
    } catch { /* без списка работаем в общем чате */ }
  }

  // ---------------------------------------------------------------- события
  function bind() {
    $("signin").addEventListener("click", signIn);
    $("logout").addEventListener("click", signOut);
    $("send").addEventListener("click", send);

    $("input").addEventListener("input", (e) => {
      const el = e.target;
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 120) + "px";
    });

    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    document.querySelectorAll(".tab[data-channel]").forEach((tab) => {
      tab.addEventListener("click", async () => {
        document.querySelectorAll(".tab[data-channel]").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        state.channel = tab.dataset.channel;
        localStorage.setItem(LS.channel, state.channel);
        $("peerRow").classList.toggle("hidden", state.channel !== "dm");
        $("title").textContent = state.channel === "dm" ? "Личные сообщения" : "Craftunity";
        state.lastId = 0;
        state.messages = [];
        if (state.channel === "dm" && state.peers.length === 0) await refreshPeers();
        await pull(true);
      });
    });

    $("peer").addEventListener("change", async (e) => {
      state.peer = e.target.value;
      state.lastId = 0;
      state.messages = [];
      await pull(true);
    });

    window.addEventListener("online", async () => {
      updateNet();
      await flushQueue();
      await pull(false);
    });
    window.addEventListener("offline", updateNet);
  }

  function updateNet() {
    const dot = $("net");
    dot.classList.toggle("on", state.online && navigator.onLine);
    dot.title = dot.classList.contains("on") ? "На связи" : "Нет связи";
  }

  async function start() {
    bind();
    updateNet();
    loadCache();
    if (!state.nick) {
      showLogin();
      return;
    }
    showChat();
    $("peerRow").classList.toggle("hidden", state.channel !== "dm");
    document.querySelectorAll(".tab[data-channel]").forEach((t) => {
      t.classList.toggle("active", t.dataset.channel === state.channel);
    });
    render();
    await refreshPeers();
    await flushQueue();
    await pull(state.lastId === 0);
    setInterval(() => { if (navigator.onLine) pull(false); }, 7000);
  }

  start();
})();
</script>
</body>
</html>
